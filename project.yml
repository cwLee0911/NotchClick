name: NotchClick
options:
  bundleIdPrefix: com.notchclick
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  xcodeVersion: "26.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual

targets:
  NotchClick:
    type: application
    platform: macOS
    sources:
      - path: app/NotchClick
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    resources:
      - path: app/NotchClick/Resources
    info:
      path: app/NotchClick/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "6"
        LSUIElement: true
        LSApplicationCategoryType: "public.app-category.utilities"
        NSAppleEventsUsageDescription: "NotchClick uses Apple Events only to control playback in Apple Music or Spotify after you choose a player."
        NSHumanReadableCopyright: "Copyright © 2026 NotchClick."
    entitlements:
      path: app/NotchClick/NotchClick.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: NotchClick
        PRODUCT_BUNDLE_IDENTIFIER: com.notchclick.app
        INFOPLIST_FILE: app/NotchClick/Info.plist
        CODE_SIGN_ENTITLEMENTS: app/NotchClick/NotchClick.entitlements
      configs:
        debug:
          CODE_SIGN_IDENTITY: Apple Development
        release:
          CODE_SIGN_IDENTITY: Developer ID Application
