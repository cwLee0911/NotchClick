<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="120" y1="42" x2="840" y2="558" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#302149"/>
      <stop offset="0.48" stop-color="#170F25"/>
      <stop offset="1" stop-color="#080710"/>
    </linearGradient>
    <linearGradient id="sheen" x1="190" y1="0" x2="770" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.38" stop-color="#C4B5FD" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 30) rotate(90) scale(420 760)">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.2"/>
      <stop offset="0.56" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerDepth" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 600) rotate(-90) scale(390 780)">
      <stop offset="0" stop-color="#000000" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
