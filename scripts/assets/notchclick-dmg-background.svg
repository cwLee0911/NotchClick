  <rect x="28" y="28" width="904" height="544" rx="30" fill="url(#sheen)" opacity="0.45"/>
  <rect x="1.5" y="1.5" width="957" height="597" rx="34.5" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <path d="M38 52C158 24 802 24 922 52" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
  <rect width="960" height="600" rx="36" filter="url(#softNoise)" opacity="0.55"/>
